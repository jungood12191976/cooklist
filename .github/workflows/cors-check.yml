name: cors-check
# 調査用(手動)：Polymarket公開APIの1回あたりのデータ量と、題名(slug)を指定した取得ができるかを測る。
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          O=data/cors_check.txt; : > $O
          B="https://gamma-api.polymarket.com/events"
          echo "page(limit=100) bytes gz/raw:" >> $O
          curl -s -H "Accept-Encoding: gzip" -o /tmp/p.gz -w "gz=%{size_download} time=%{time_total}\n" "$B?limit=100&active=true&closed=false&order=volume24hr&ascending=false" >> $O
          curl -s -o /tmp/p.json -w "raw=%{size_download}\n" "$B?limit=100&active=true&closed=false&order=volume24hr&ascending=false" >> $O
          S1=$(python3 - <<'PY'
          import json,sys
          d=json.load(open('data/polymarket.json'))
          s=[]
          for t in d['themes']:
              for e in t['events']:
                  if e['slug'] not in s: s.append(e['slug'])
          open('/tmp/slugs.txt','w').write('\n'.join(s))
          print('&'.join('slug='+x for x in s[:10]))
          PY
          )
          echo "unique slugs in saved json: $(wc -l < /tmp/slugs.txt)" >> $O
          curl -s -o /tmp/s.json -w "multi-slug(10) http=%{http_code} bytes=%{size_download} time=%{time_total}\n" "$B?$S1" >> $O
          python3 -c "import json;d=json.load(open('/tmp/s.json'));print('multi-slug events returned:',len(d))" >> $O
          S2=$(python3 -c "print('&'.join('slug='+x for x in open('/tmp/slugs.txt').read().split()))")
          curl -s -o /tmp/s2.json -w "multi-slug(all) http=%{http_code} bytes=%{size_download} time=%{time_total}\n" "$B?$S2" >> $O
          python3 -c "import json;d=json.load(open('/tmp/s2.json'));print('all-slug events returned:',len(d), 'markets', sum(len(e.get('markets') or []) for e in d))" >> $O
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cors_check.txt
          git commit -m "Polymarketのデータ量確認(調査用)" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
