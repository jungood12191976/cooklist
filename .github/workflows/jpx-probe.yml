name: jpx-probe

# JPXの決算発表予定日Excelの中身を確認するだけの一回用ワークフロー(アプリには影響しない)。
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_jpx.py'
      - '.github/workflows/jpx-probe.yml'

permissions:
  contents: write

concurrency: jpx-probe

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl requests
      - run: python scripts/probe_jpx.py
      - name: commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jpx_probe.txt
          git commit -m "jpx probe result" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
