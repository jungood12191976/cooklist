name: polymarket-study

# 調査用(手動で動かす)。Polymarketが日本時間の何時台によく動くかを測り、data/polymarket_hours_study.* に保存する。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/study_polymarket_hours.py
      - name: commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/polymarket_hours_study.json data/polymarket_hours_study.txt
          git commit -m "Polymarketの時間帯別の動きを集計(調査用)" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
