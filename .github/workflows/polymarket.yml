name: polymarket

# Polymarket(公開API)から株に関係する市場を集めて data/polymarket.json を更新する。
# 2026-10-22 キング承認：Polymarketはアメリカの活動時間(日本の夜〜朝)によく動き、日本の昼〜夕方は静かだった(14日・40市場の実測。data/polymarket_hours_study.txt)ため、
# 日本時間 22:10〜翌8:10 は毎時、7:30(朝の確認の直前)に1回、昼は 12:10 / 16:10 / 20:10 の3回。cronはUTC表記。
on:
  schedule:
    - cron: '10 13-23 * * *'   # 日本時間 22:10〜翌8:10(毎時)
    - cron: '30 22 * * *'      # 日本時間 7:30(朝の確認の直前)
    - cron: '10 3,7,11 * * *'  # 日本時間 12:10 / 16:10 / 20:10
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_polymarket.py'
      - '.github/workflows/polymarket.yml'

permissions:
  contents: write

concurrency: polymarket

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/fetch_polymarket.py
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/polymarket.json data/polymarket_check.txt
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "Polymarket(株関連テーマ)を更新"
          git pull --rebase origin main
          git push origin HEAD:main
