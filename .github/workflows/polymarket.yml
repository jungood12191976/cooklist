name: polymarket

# Polymarket(公開API)から株に関係する市場を集めて data/polymarket.json を更新する。毎時(10分過ぎ)。
on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_polymarket.py'
      - '.github/workflows/polymarket.yml'

permissions:
  contents: write

concurrency: polymarket

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/fetch_polymarket.py
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/polymarket.json data/polymarket_check.txt
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "Polymarket(株関連テーマ)を更新"
          git pull --rebase origin main
          git push origin HEAD:main
