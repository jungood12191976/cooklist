name: probe-jpx
# 確認用(1回だけ): JPXのExcelの構造を data/investor_flows_probe.txt に書く
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_jpx.py'
      - '.github/workflows/probe-jpx.yml'
permissions:
  contents: write
concurrency: probe-jpx
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests openpyxl
      - run: python scripts/probe_jpx.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investor_flows_probe.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "JPX構造の確認結果"
          git pull --rebase origin main
          git push origin HEAD:main
