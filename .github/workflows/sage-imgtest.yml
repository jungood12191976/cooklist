name: sage-imgtest
# 賢者の画像添付の実験(一時。確認後に削除する)
on:
  push:
    paths:
      - '.github/workflows/sage-imgtest.yml'
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install pillow -q
          python3 - <<'PY2'
          import os, json, base64, random, urllib.request
          from PIL import Image, ImageDraw
          random.seed(1)
          im = Image.new('RGB', (720, 1280), 'white'); d = ImageDraw.Draw(im)
          for i in range(400):
              x=random.randint(0,700); y=random.randint(0,1260); d.rectangle([x,y,x+random.randint(5,60),y+random.randint(3,20)], fill=(random.randint(0,255),random.randint(0,255),random.randint(0,255)))
          d.rectangle([30,560,690,700], fill='white'); d.text((50,620), 'SAGE-IMG-CODE 7391', fill='black')
          im = im.resize((540,960)); im.save('t.jpg', quality=40)
          b = base64.b64encode(open('t.jpg','rb').read()).decode()
          print('::notice::base64サイズ', len(b))
          q = '【画像テスト】質問の末尾の[画像base64]をファイル(base64 -d)に保存してReadで開き、書かれている文字(SAGE-IMG-CODEで始まる文)を答えに書いてください。 [画像base64:jpeg]' + b
          body = json.dumps({'text': json.dumps({'qid': 'imgtest03', 'q': q, 'asked_at': '2026-10-14 20:40'}, ensure_ascii=False)}).encode()
          req = urllib.request.Request('https://api.anthropic.com/v1/claude_code/routines/trig_012UDrPAtWBZgc551Y1RpgfQ/fire', data=body, method='POST', headers={
            'Authorization': 'Bearer ' + os.environ['T'], 'anthropic-beta': 'experimental-cc-routine-2026-04-01',
            'anthropic-version': '2023-06-01', 'Content-Type': 'application/json'})
          try:
            r = urllib.request.urlopen(req, timeout=30); print('::notice::起こした', r.status)
          except Exception as e:
            print('::error::失敗', e, getattr(e,'read',lambda:b'')()[:300])
          PY2
        env:
          T: ${{ secrets.SAGETOKEN }}
