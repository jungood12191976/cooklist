<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>画像読み取り実験</title>
<style>
body{font-family:sans-serif;background:#fff;color:#222;margin:0;padding:16px;line-height:1.6}
button,input{font-size:16px}
.btn{display:block;width:100%;padding:14px;margin:12px 0;border:0;border-radius:10px;background:#1c4fc8;color:#fff;font-size:17px}
pre{white-space:pre-wrap;word-break:break-all;background:#f3f3f3;padding:10px;border-radius:8px;font-size:13px}
</style></head><body>
<h3>🔬 画像読み取り実験（Gemini）</h3>
<p>① 下のボタンでスクショを1枚えらぶ<br>② 結果がこの画面に出ます（数十秒かかることがあります）</p>
<input id="f" type="file" accept="image/*" style="display:none">
<button class="btn" id="pick">📷 スクショをえらぶ</button>
<div id="info"></div>
<pre id="out">まだ何もしていません</pre>
<script>
(function(){
  const MODELS = ['gemini-3.6-flash','gemini-3.8-flash','gemini-3.5-flash-lite'];
  const out = document.getElementById('out'), info = document.getElementById('info');
  function keys(){
    try{ const r = JSON.parse(localStorage.getItem('wd3:geminikeys')||'null'); if(r&&r.keys&&r.keys.length) return r.keys; }catch(e){}
    try{ const k = JSON.parse(localStorage.getItem('wd3:geminikey')||'null'); if(k&&k.key) return [k.key]; }catch(e){}
    return [];
  }
  function log(s){ out.textContent += '\n' + s; }
  function shrink(file){
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file), im = new Image();
      im.onload = () => {
        const M = 1280, sc = Math.min(1, M / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        c.toBlob(b => { URL.revokeObjectURL(url); b ? res({blob:b, w:c.width, h:c.height, ow:im.width, oh:im.height}) : rej(new Error('縮小に失敗')); }, 'image/jpeg', 0.75);
      };
      im.onerror = () => rej(new Error('画像を開けませんでした'));
      im.src = url;
    });
  }
  function b64(blob){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(new Error('変換に失敗')); r.readAsDataURL(blob); }); }
  document.getElementById('pick').onclick = () => document.getElementById('f').click();
  document.getElementById('f').onchange = async (e) => {
    const file = e.target.files[0]; if(!file) return;
    out.textContent = '開始';
    const ks = keys();
    if(!ks.length){ log('❌ このブラウザにGeminiのキーが見つかりません（アプリを開いている同じブラウザで開いてください）'); return; }
    try{
      const s = await shrink(file);
      info.textContent = '元 ' + s.ow + '×' + s.oh + ' → ' + s.w + '×' + s.h + ' / ' + Math.round(s.blob.size/1024) + 'KB';
      const data = await b64(s.blob);
      const prompt = 'この画像に写っている文字と数字を、見えるとおりに書き出してください。推測は書かず、読めない所は「読めない」と書いてください。';
      const body = JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:'image/jpeg',data:data}}]}]});
      for(const model of MODELS){
        const t0 = Date.now();
        log('▶ ' + model + ' に送信…');
        const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 40000);
        try{
          const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(ks[0]), {method:'POST', headers:{'Content-Type':'application/json'}, body, signal: ac.signal});
          clearTimeout(tm);
          const ms = Date.now() - t0;
          if(!res.ok){ let d=''; try{ d=(await res.json()).error.message; }catch(x){} log('  ✖ 状態 ' + res.status + ' (' + ms + 'ms) ' + d.slice(0,120)); continue; }
          const j = await res.json();
          const txt = (((j.candidates||[])[0]||{}).content||{}).parts;
          log('  ✔ 成功 (' + ms + 'ms)\n――― 読み取り結果 ―――\n' + (txt ? txt.map(p => p.text||'').join('') : JSON.stringify(j).slice(0,300)));
          return;
        }catch(err){ clearTimeout(tm); log('  ✖ ' + (err.name==='AbortError' ? '40秒たっても返事なし' : err.message)); }
      }
      log('❌ 3つのモデルすべて失敗');
    }catch(err){ log('❌ ' + err.message); }
  };
})();
</script></body></html>
