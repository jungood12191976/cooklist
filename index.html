<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KING THE QUEST ―年収1億円―</title>
<style>
  html, body{ margin:0; padding:0; background:#1b1f4a; }
  .rpg-root, .rpg-root *{ box-sizing: border-box; font-family: "MS Gothic","ＭＳ ゴシック","DotGothic16","Osaka-mono",monospace; }
  .rpg-root{
    position: relative; max-width: 480px; margin: 0 auto; min-height: 100%;
    background:
      radial-gradient(1px 1px at 20px 30px, #fff 100%, transparent),
      radial-gradient(1px 1px at 90px 80px, #fff 100%, transparent),
      radial-gradient(1px 1px at 150px 40px, #fff 100%, transparent),
      radial-gradient(1px 1px at 200px 120px, #fff 100%, transparent),
      radial-gradient(1px 1px at 260px 60px, #fff 100%, transparent),
      radial-gradient(1px 1px at 320px 150px, #fff 100%, transparent),
      radial-gradient(1px 1px at 40px 180px, #fff 100%, transparent),
      linear-gradient(180deg, #1b1f4a 0%, #2c1f5c 40%, #3a2a5e 100%);
    color: #fff; padding: 14px 12px 40px; overflow-x: hidden;
  }
  .pw{ position: relative; background: linear-gradient(180deg,#1c2a5e,#111a3d); border: 3px solid #ffd76b;
    box-shadow: inset 0 0 0 3px #1c2a5e, inset 0 0 0 6px #6ea8ff, 0 4px 0 rgba(0,0,0,0.35); padding: 14px; margin-bottom: 14px; }
  .pw-title{ display:flex; align-items:center; gap:6px; background:#ffd76b; color:#2c1f5c; font-size: 12px; font-weight: bold; padding: 3px 10px; margin: -22px 0 10px -4px; border: 2px solid #a9741f; letter-spacing: 1px; width:fit-content; }
  .rpg-topbar{ display:flex; align-items:center; gap:10px; margin-bottom: 4px; padding-right: 46px; }
  .rpg-date{ flex:1; text-align:center; font-size: 12px; color: #ffd76b; letter-spacing: 2px; }
  .rpg-settings-link{ background:none; border:none; color:#9db4ff; font-size:11px; text-decoration:underline; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .rpg-countdown{ text-align:center; font-size: 12.5px; color:#9db4ff; margin-bottom: 10px; letter-spacing: .5px; }
  .rpg-countdown b{ color:#ff9b6a; font-size:15px; }
  .rpg-h1{ text-align:center; font-size: 19px; font-weight: bold; color: #fff; text-shadow: 2px 2px 0 #3a2a5e, 0 0 12px rgba(110,168,255,0.6); margin: 4px 0 14px; letter-spacing: 1.5px; }

  .rpg-label{ font-size: 12.5px; color: #9db4ff; margin-bottom: 6px; }
  .rpg-date-input{ background:#0c1230; border: 2px solid #6ea8ff; color:#fff; padding: 7px 9px; font-size: 13px; }
  .rpg-select{ background:#0c1230; border: 2px solid #6ea8ff; color:#fff; padding: 7px 9px; font-size: 13px; }
  .rpg-toggle-row{ display:flex; gap:6px; }
  .rpg-toggle{ flex:1; background:#0c1230; border: 2px solid #6ea8ff; color:#cdd8ff; padding: 8px 4px; font-size: 12.5px; cursor:pointer; }
  .rpg-toggle.active{ background:#4ade80; color:#0c1230; font-weight:bold; border-color:#4ade80; }
  .rpg-btn{ background:#ffd76b; color:#2c1f5c; border: 2px solid #a9741f; font-weight:bold; font-size: 13.5px; padding: 10px 14px; cursor:pointer; }
  .rpg-btn:active{ transform: translateY(1px); }
  .rpg-btn.secondary{ background:#0c1230; color:#9db4ff; border-color:#6ea8ff; }
  .rpg-btn.wide{ width:100%; margin-top: 8px; }
  .rpg-setup-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom: 1px dashed #2e3a6e; font-size:13.5px; }
  .rpg-setup-row:last-child{ border-bottom:none; }
  .rpg-setup-val{ color:#ffd76b; font-weight:bold; }
  .rpg-auto-status{ font-size: 11px; color: #9db4ff; margin-top: 5px; }

  /* ---- pixel hero sprite ---- */
  .rpg-scene{ position:relative; height: 118px; display:flex; align-items:flex-end; justify-content:center; margin-bottom: 10px; padding-bottom: 14px; }
  .rpg-hero{ position: relative; width: 48px; height: 76px; margin: 0 auto; }
  .rpg-hero .h-hair{ position:absolute; top:0; left:12px; width:24px; height:10px; background:#5a3a22; border:2px solid #12163a; border-radius: 4px 4px 0 0; z-index:3; }
  .rpg-hero .h-head{ position:absolute; top:6px; left:14px; width:20px; height:16px; background:#f4c99b; border:2px solid #12163a; z-index:2; }
  .rpg-hero .h-body{ position:absolute; top:22px; left:10px; width:28px; height:24px; background:#3e6bd8; border:2px solid #12163a; z-index:2; }
  .rpg-hero .h-belt{ position:absolute; top:42px; left:10px; width:28px; height:5px; background:#ffd76b; border:1px solid #12163a; z-index:3; }
  .rpg-hero .h-armL{ position:absolute; top:24px; left:3px; width:7px; height:16px; background:#3e6bd8; border:2px solid #12163a; }
  .rpg-hero .h-armR{ position:absolute; top:24px; left:38px; width:7px; height:16px; background:#f4c99b; border:2px solid #12163a; }
  .rpg-hero .h-legL{ position:absolute; top:46px; left:12px; width:9px; height:20px; background:#2a3a7a; border:2px solid #12163a; transform-origin: top center; }
  .rpg-hero .h-legR{ position:absolute; top:46px; left:27px; width:9px; height:20px; background:#2a3a7a; border:2px solid #12163a; transform-origin: top center; }
  .rpg-hero .h-sword{ position:absolute; top:14px; left:41px; width:5px; height:30px; background:#dfe6ee; border:1px solid #12163a; transform: rotate(25deg); transform-origin: top center; z-index:1; }
  .rpg-hero.walk-a .h-legL{ transform: rotate(20deg); }
  .rpg-hero.walk-a .h-legR{ transform: rotate(-20deg); }
  .rpg-hero.walk-b .h-legL{ transform: rotate(-20deg); }
  .rpg-hero.walk-b .h-legR{ transform: rotate(20deg); }
  .rpg-hero.slash .h-sword{ transform: rotate(-90deg); }
  .rpg-bed{ position:relative; width: 90px; height: 46px; }
  .rpg-bed .b-frame{ position:absolute; bottom:0; left:0; width:90px; height:14px; background:#7a4a2a; border:2px solid #1b1f4a; }
  .rpg-bed .b-mattress{ position:absolute; bottom:12px; left:4px; width:82px; height:14px; background:#dfe6ee; border:2px solid #1b1f4a; }
  .rpg-bed .b-pillow{ position:absolute; bottom:22px; left:6px; width:20px; height:10px; background:#fff; border:2px solid #1b1f4a; }
  .rpg-bed .b-hero{ position:absolute; bottom:22px; left:22px; width:44px; height:10px; background:#3e6bd8; border:2px solid #1b1f4a; }
  .rpg-zzz{ position:absolute; top:-6px; right:4px; font-size: 14px; color:#9db4ff; animation: zzzfloat 2s ease-in-out infinite; }
  @keyframes zzzfloat{ 0%{ transform:translateY(0); opacity:0.3; } 50%{ transform:translateY(-8px); opacity:1; } 100%{ transform:translateY(-16px); opacity:0; } }
  .rpg-scene-caption{ position:absolute; bottom:-2px; font-size:10.5px; color:#9db4ff; }

  .rpg-energy-wrap{ text-align:center; margin-bottom: 10px; }
  .rpg-energy-num{ font-size: 40px; font-weight:bold; line-height:1; text-shadow: 2px 2px 0 rgba(0,0,0,0.4); }
  .rpg-energy-label{ font-size:11px; color:#9db4ff; letter-spacing:2px; margin-top:2px; }
  .rpg-level-badge{ display:inline-block; background:#ffd76b; color:#2c1f5c; font-weight:bold; font-size: 13px; padding: 5px 12px; border: 2px solid #a9741f; margin-top: 8px; }

  .rpg-status-effects{ display:flex; flex-wrap:wrap; gap: 6px; margin-top: 10px; justify-content:center; }
  .rpg-badge{ font-size: 11px; padding: 5px 8px; border: 1.5px solid; background: rgba(0,0,0,0.25); }
  .rpg-badge.warn{ color:#ff9b6a; border-color:#ff9b6a; }
  .rpg-badge.ok{ color:#4ade80; border-color:#4ade80; }
  .rpg-badge.info{ color:#6ea8ff; border-color:#6ea8ff; }

  .rpg-narrator{ background:#0c1230; border: 2px solid #9db4ff; padding: 12px 14px; font-size: 14px; line-height: 1.8; color: #eaf0ff; min-height: 50px; }
  .rpg-narrator b{ color:#ffd76b; }
  .rpg-cursor{ display:inline-block; width: 8px; height: 14px; background:#ffd76b; animation: rpgblink 0.8s steps(1) infinite; vertical-align: text-bottom; margin-left: 2px; }
  @keyframes rpgblink{ 50%{opacity:0;} }

  .rpg-quest-add{ display:flex; gap:6px; margin-bottom: 10px; }
  .rpg-quest-add input{ flex:1; background:#0c1230; border:2px solid #6ea8ff; color:#fff; padding:9px; font-size:13.5px; }
  .rpg-quest-item{ display:flex; align-items:center; gap:10px; background:#0c1230; border:2px solid #6ea8ff; padding: 11px 12px; margin-bottom: 8px; transition: opacity .5s ease, transform .5s ease; }
  .rpg-quest-item.vanish{ opacity:0; transform: scale(0.6) rotate(8deg); }
  .rpg-quest-check{ min-width: 30px; height:30px; border:2px solid #4ade80; background:#0c1230; color:#4ade80; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .rpg-quest-item-text{ flex:1; font-size: 14px; }
  .rpg-quest-empty{ font-size:12.5px; color:#9db4ff; text-align:center; padding: 10px 0; }

  /* pixel treasure chest button */
  .rpg-chest-btn{ display:block; margin: 8px auto 0; background:none; border:none; cursor:pointer; padding:4px; }
  .rpg-chest{ position:relative; width:40px; height:30px; margin:0 auto; }
  .rpg-chest .c-body{ position:absolute; bottom:0; width:40px; height:18px; background:#8a5a2b; border:2px solid #4a2f14; }
  .rpg-chest .c-lid{ position:absolute; top:0; width:40px; height:12px; background:#a9741f; border:2px solid #4a2f14; border-radius: 6px 6px 0 0; }
  .rpg-chest .c-band{ position:absolute; top:0; left:17px; width:6px; height:30px; background:#ffd76b; border:1px solid #4a2f14; }
  .rpg-chest .c-gem{ position:absolute; top:9px; left:16px; width:8px; height:8px; background:#ff5f5f; border:1px solid #7a1f1f; border-radius:50%; }
  .rpg-chest-label{ text-align:center; font-size:11px; color:#9db4ff; margin-top:2px; }

  .rpg-pot-wrap{ text-align:center; padding: 6px 0; }
  .rpg-pot-emoji{ font-size: 46px; display:inline-block; }
  .rpg-pot-brewing .rpg-pot-emoji{ animation: potshake 0.3s ease-in-out infinite; }
  @keyframes potshake{ 0%,100%{ transform: rotate(-6deg);} 50%{ transform: rotate(6deg);} }
  .rpg-pot-status{ font-size: 12.5px; color:#9db4ff; margin-top: 8px; min-height: 16px; }

  .rpg-item{ background:#0c1230; border: 2px solid #6ea8ff; padding: 16px 16px; margin-bottom: 10px; }
  .rpg-item.rare{ border-color:#ffd76b; box-shadow: 0 0 10px rgba(255,215,107,0.5); }
  .rpg-rare-tag{ display:inline-block; background:#ffd76b; color:#2c1f5c; font-size:11px; font-weight:bold; padding:3px 7px; margin-bottom:8px; }
  .rpg-item-name{ font-size: 19px; font-weight: bold; color: #ffd76b; margin-bottom: 10px; line-height:1.4; }
  .rpg-item-name:before{ content:"◆ "; }
  .rpg-item-meaning{ font-size: 16.5px; line-height: 1.75; color: #dbe4ff; background: rgba(110,168,255,0.14); padding: 12px 13px; margin-bottom: 10px; }
  .rpg-item-recipe{ font-size: 16px; line-height: 1.75; color: #c8d3f5; }
  .rpg-item-cap{ font-size: 12px; color:#ff9b6a; margin-top: 8px; }

  .rpg-dungeon{ background:#0c1230; border: 2px solid #6ea8ff; padding: 12px 13px; margin-bottom: 10px; }
  .rpg-dungeon-name{ font-size: 15px; font-weight:bold; color:#fff; margin-bottom: 6px; }
  .rpg-dungeon-floor-bar{ display:flex; gap:1px; margin-bottom: 6px; height:14px; background:#1c2a5e; border: 1px solid #3a4a8e; overflow:hidden; }
  .rpg-dungeon-floor-fill{ height:100%; background: linear-gradient(90deg,#ffd76b,#f0a63e); transition: width .5s ease; }
  .rpg-dungeon-meta{ font-size: 11.5px; color:#9db4ff; }
  .rpg-dungeon-note{ font-size: 11px; color:#9db4ff; margin-top:6px; line-height:1.6; }

  .rpg-sos-btn{ width:100%; background: linear-gradient(180deg,#ff9b6a,#e0521f); color: #fff; border: 3px solid #ffd76b; padding: 15px; font-size: 15px; font-weight: bold; cursor:pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.4); margin-top:6px; }
  .rpg-sos-btn:before{ content:"📜 "; }

  .rpg-sound-toggle{ position: fixed; top: 14px; right: 14px; z-index: 60; background:#0c1230; border: 2px solid #ffd76b; color:#ffd76b; font-size: 18px; width: 40px; height: 40px; cursor:pointer; display:flex; align-items:center; justify-content:center; }

  .rpg-modal-backdrop{ position: fixed; inset: 0; background: rgba(10,10,30,0.75); display:none; align-items: flex-end; justify-content:center; z-index: 50; }
  .rpg-modal-backdrop.open{ display:flex; }
  .rpg-modal{ width:100%; max-width: 480px; background: linear-gradient(180deg,#1c2a5e,#111a3d); border-top: 3px solid #ffd76b; box-shadow: inset 0 0 0 3px #1c2a5e, inset 0 0 0 6px #6ea8ff; padding: 20px 16px 26px; max-height: 85vh; overflow-y: auto; }
  .rpg-modal-title{ font-size: 17px; font-weight:bold; color:#ffd76b; margin-bottom: 6px; }
  .rpg-modal-sub{ font-size: 12.5px; color:#9db4ff; margin-bottom: 14px; line-height:1.6; }
  .rpg-state-btn{ display:block; width:100%; text-align:left; background:#0c1230; border: 2px solid #6ea8ff; color:#fff; padding: 13px 15px; font-size: 14px; margin-bottom: 8px; cursor:pointer; }
  .rpg-state-btn:active{ background:#6ea8ff; color:#0c1230; }
  .rpg-advice-box{ background: rgba(110,168,255,0.1); border: 2px solid #6ea8ff; padding: 14px; margin-top: 8px; }
  .rpg-advice-line{ font-size: 13.5px; line-height: 1.75; margin-bottom: 9px; color: #eaf0ff; }
  .rpg-advice-line b{ color:#ffd76b; }
  .rpg-log-row{ font-size: 12px; color:#cdd8ff; border-bottom: 1px dashed #2e3a6e; padding: 7px 0; }
  .rpg-log-date{ color:#9db4ff; margin-right: 8px; }

  .rpg-title-screen{ position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(1px 1px at 15% 20%, #fff 100%, transparent), radial-gradient(1px 1px at 35% 65%, #fff 100%, transparent), radial-gradient(1px 1px at 55% 15%, #fff 100%, transparent), radial-gradient(1px 1px at 75% 50%, #fff 100%, transparent), radial-gradient(1px 1px at 85% 80%, #fff 100%, transparent), linear-gradient(180deg,#1b1f4a,#2c1f5c 50%,#3a2a5e);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 24px; text-align:center; }
  .rpg-title-logo{ font-size: 24px; font-weight:bold; color:#ffd76b; text-shadow: 3px 3px 0 #a9741f, 0 0 20px rgba(255,215,107,0.6); letter-spacing: 2px; margin-bottom: 8px; line-height: 1.5; }
  .rpg-title-sub2{ font-size: 13px; color:#ff9b6a; margin-bottom: 34px; letter-spacing:1px; }
  .rpg-press-start{ font-size: 15px; color:#fff; border: 2px solid #fff; padding: 12px 24px; background: rgba(0,0,0,0.3); cursor:pointer; animation: rpgblink 1.1s steps(1) infinite; }
  .rpg-title-hint{ font-size: 11px; color:#9db4ff; margin-top: 20px; line-height: 1.7; }

  .rpg-confetti{ position: fixed; top:-10px; width:8px; height:8px; z-index: 200; pointer-events:none; animation: confettifall linear forwards; }
  @keyframes confettifall{ to { transform: translateY(110vh) rotate(600deg); opacity: 0.2; } }
</style>
</head>
<body>

<button class="rpg-sound-toggle" id="rpgSoundToggle">🔊</button>

<div id="rpgTitleScreen" class="rpg-title-screen">
  <div class="rpg-title-logo">KING THE QUEST</div>
  <div class="rpg-title-sub2">―年収1億円―</div>
  <button class="rpg-press-start" id="rpgStartBtn">▶ ぼうけんをはじめる</button>
  <div class="rpg-title-hint">タップして冒険をスタート(音が鳴ります)</div>
</div>

<div class="rpg-root" id="rpgRoot" style="display:none;"></div>

<div class="rpg-modal-backdrop" id="rpgModalBackdrop"><div class="rpg-modal"><div id="rpgModalContent"></div></div></div>

<script>
(function(){

  // ================= STORAGE (localStorage — works standalone & on GitHub Pages) =================
  const memFallback = {};
  function lsGet(key){
    try {
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : null;
    } catch(e){ return memFallback[key] || null; }
  }
  function lsSet(key, value){
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch(e){ memFallback[key] = value; console.error('localStorage set failed, using in-memory fallback', e); return false; }
  }

  // ================= AUDIO ENGINE =================
  let actx = null, soundOn = true, bgmTimer = null;
  function ensureAudio(){
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ console.error(e); } }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function tone(freq, start, dur, type, vol){
    if (!soundOn || !actx) return;
    const osc = actx.createOscillator(), gain = actx.createGain();
    osc.type = type || 'square'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, actx.currentTime + start);
    gain.gain.linearRampToValueAtTime(vol||0.05, actx.currentTime + start + 0.01);
    gain.gain.linearRampToValueAtTime(0, actx.currentTime + start + dur);
    osc.connect(gain).connect(actx.destination);
    osc.start(actx.currentTime + start); osc.stop(actx.currentTime + start + dur + 0.02);
  }
  function playTick(){ tone(1200+Math.random()*200, 0, 0.03, 'square', 0.03); }
  function playSelect(){ tone(660,0,0.05,'square',0.045); tone(880,0.05,0.06,'square',0.045); }
  function playOpen(){ tone(520,0,0.05,'triangle',0.05); tone(780,0.05,0.08,'triangle',0.05); }
  function playFanfare(){ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*0.12,0.16,'square',0.055)); }
  function playLevelUp(){ [392,523,659,784,1047,1319].forEach((f,i)=>tone(f,i*0.09,0.14,'triangle',0.06)); }
  function playComplete(){ [660,880,1320].forEach((f,i)=>tone(f,i*0.08,0.18,'square',0.06)); }
  function playPotBubble(){ tone(300+Math.random()*400, 0, 0.08, 'sine', 0.02); }
  function playSlash(){ tone(200,0,0.05,'sawtooth',0.05); tone(1400,0.03,0.05,'square',0.04); }

  // ---- adventurous, upbeat BGM (not sleepy): melody + light bass pulse, randomized ----
  const ADV_SCALE = [392,440,494,523,587,659,698,784,880,988];
  let bgmMelStep = 0, bgmBassStep = 0, bgmMelTimer=null, bgmBassTimer=null;
  function startBGM(){
    stopBGM();
    bgmMelTimer = setInterval(() => {
      if (!soundOn) return;
      const note = ADV_SCALE[Math.floor(Math.random()*ADV_SCALE.length)];
      const dur = Math.random() < 0.3 ? 0.28 : 0.16;
      tone(note, 0, dur, 'square', 0.028);
      bgmMelStep++;
    }, 230);
    bgmBassTimer = setInterval(() => {
      if (!soundOn) return;
      tone(196, 0, 0.3, 'triangle', 0.03);
      bgmBassStep++;
    }, 460);
  }
  function stopBGM(){
    if (bgmMelTimer){ clearInterval(bgmMelTimer); bgmMelTimer=null; }
    if (bgmBassTimer){ clearInterval(bgmBassTimer); bgmBassTimer=null; }
  }

  function spawnConfetti(){
    const colors = ['#ffd76b','#6ea8ff','#4ade80','#ff9b6a','#ff6b6b','#c084fc'];
    for (let i=0;i<28;i++){
      const el = document.createElement('div');
      el.className = 'rpg-confetti';
      el.style.left = Math.random()*100 + 'vw';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.animationDuration = (1.2 + Math.random()*1.2) + 's';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 2600);
    }
  }

  // ================= GENE PROFILE (for Gemini prompt grounding) =================
  const GENE_PROFILE = `
- MTHFR等により葉酸・B6・B12の必要性が高い(メチル化経路)
- FADS1/FADS2が弱くALAからEPA/DHAへの変換効率が低い(魚由来の直接摂取が有効)
- DIO2が弱くT4→T3変換が落ちやすい(体を温める食材・セレン・亜鉛が有効)
- KEAP1-NRF2感受性があり、アブラナ科野菜・にんにく等の解毒サポートが有効
- AGT型で塩分感受性があり、カリウム豊富な野菜(減塩)が有効
- PPARG等によりインスリン感受性の個性があり、低GI・食物繊維が有効
- GAD1等によりGABA合成にB6・マグネシウム・タウニンが関わる
- ヒスタミン代謝(DAO・HDC)にビタミンCが関わる
`.trim();

  const STATE_ADVICE = {
    damage: { label:'💀‼️ ダメージを受けた',
      lines: (phase) => [
        `<b>今すぐ1つだけ:</b> マグネシウム入りの温かい飲み物(カカオ85%を溶かした豆乳ココア)を一口。`,
        phase === 'ovulation' ? `<b>体の中で起きていること:</b> 排卵期でエストロゲンが急降下中。自律神経が一時的にざわつくのは正常な反応です。`

  async function loadAll(){

  async function saveDay(){ lsSet('wd3:' + todayKey, dayData); }
  async function saveCycle(){ lsSet('wd3:cycle', {ovulationDate}); }
  async function saveQuests(){ lsSet('wd3:quests', {quests}); }

  function cycleInfo(){
    if (!ovulationDate) return null;
    const ov = new Date(ovulationDate + 'T00:00:00');
    const diffDays = Math.floor((today - ov) / 86400000);
    const periodExpected = new Date(ov.getTime() + 14*86400000);
    const daysToPeriod = Math.floor((periodExpected - today) / 86400000);
    let phase, phaseLabel;
    if (diffDays < -1) { phase='follicular'; phaseLabel='卵胞期'; }
    else if (diffDays >= -1 && diffDays <= 1) { phase='ovulation'; phaseLabel='排卵期'; }
    else if (daysToPeriod <= 4 && daysToPeriod >= 0) { phase='luteal_late'; phaseLabel='生理前'; }
    else if (daysToPeriod < 0) { phase='menstrual'; phaseLabel='生理中?'; }
    else { phase='luteal_mid'; phaseLabel='黄体期'; }
    return {diffDays, daysToPeriod, phase, phaseLabel};
  }
  function weatherIsLowPressure(){ return dayData.weather === 'rain_low' || dayData.weather === 'humid'; }

  const SLEEP_ENERGY = {'5':40,'5.5':55,'6':70,'6.5':85,'7':100,'7.5':100,'8':100};
  function energyValue(){
    let e = dayData.sleepHours ? (SLEEP_ENERGY[String(dayData.sleepHours)] ?? 70) : 70;
    const ci = cycleInfo();
    if (ci && ci.phase === 'luteal_late') e -= 30;
    if (ci && ci.phase === 'ovulation') e -= 15;
    if (weatherIsLowPressure()) e -= 10;
    return Math.max(0, Math.min(100, e));
  }

  function fmtDateShort(d){
    const days = ['日','月','火','水','木','金','土'];
    return (d.getMonth()+1)+'月'+d.getDate()+'日（'+days[d.getDay()]+'）';
  }
  function fmtDateLog(iso){ const d = new Date(iso); return (d.getMonth()+1)+'/'+d.getDate(); }
  function countdownDays(){ return Math.max(0, Math.ceil((TARGET_DATE - new Date()) / 86400000)); }
  function isNightMode(){ const h = new Date().getHours(); return h >= 22 || h < 5; }

  function narratorText(){
    const ci = cycleInfo();
    let parts = [];
    if (ci) {
      if (ci.phase === 'ovulation') parts.push('排卵期でエストロゲンが変動中。<b>まずカカオ85%を一かけ</b>、それから今日の冒険に出ましょう。');
      else if (ci.phase === 'luteal_late') parts.push(`生理予定まであと${ci.daysToPeriod}日、セロトニン・マグネシウム需要が上がる時期。<b>先に一口補給</b>してから進みましょう。`);
      else if (ci.phase === 'menstrual') parts.push('生理が近い、または始まっている時期。<b>鉄分を意識した一皿を先に</b>。');
    }
    if (weatherIsLowPressure()) parts.push('低気圧・高湿度のフィールド。<b>白湯+生姜を一口</b>飲んでから進むと切り替えが早くなります。');
    if (dayData.sleepHours && parseFloat(dayData.sleepHours) < 6.5) parts.push('睡眠がやや短めですね。<b>今ここで1分だけ深呼吸</b>、それだけで今日は十分取り戻せます。');
    if (isNightMode()) parts.push('もう夜も遅い時間。<b>今日はここまでにして、宿でしっかり休みましょう。</b>');
    if (parts.length === 0) parts.push('今日は大きな負荷要因は見当たりません。<b>このペースで押していきましょう。</b>');
    return parts.join(' ');
  }

  function typewrite(el, html, speed){
    const full = html; let i = 0;
    const cursor = document.createElement('span'); cursor.className='rpg-cursor';
    function step(){
      if (i > full.length) { el.innerHTML = full; return; }
      let cut = i;
      let openIdx = full.lastIndexOf('<', cut), closeIdx = full.indexOf('>', openIdx);
      if (openIdx !== -1 && closeIdx !== -1 && openIdx < cut && cut <= closeIdx) { cut = closeIdx+1; i = cut; }
      el.innerHTML = full.slice(0, cut); el.appendChild(cursor);
      if (i % 2 === 0) playTick();
      i += 2;
      if (i <= full.length) setTimeout(step, speed||18); else el.innerHTML = full;
    }
    step();
  }

  // ================= GEMINI RECIPE GENERATION =================
  async function generateGeminiRecipe(mainIngredient){
    const ci = cycleInfo();
    const phase = ci ? ci.phaseLabel : '不明';
    const lowP = weatherIsLowPressure() ? 'はい(体を温める食材を優先)' : 'いいえ';
    const prompt = `あなたは管理栄養士です。以下の人物の遺伝的な栄養特性と今日の状況、今日使いたい主な食材をもとに、実用的で美味しく作れる家庭料理レシピを1つだけ提案してください。

【遺伝的な特徴】
${GENE_PROFILE}

【今日の状況】
周期フェーズ: ${phase}
低気圧・体を温める食材が有効か: ${lowP}

【今日使いたい主な食材】
${mainIngredient}

以下のJSON形式のみを出力してください。他のテキストや説明、コードブロック記法は一切含めないでください。
{"name":"料理名(主な食材を含む)","meaning":"なぜこの人の遺伝的特徴に合うか。100字程度、日本語。","recipe":"作り方。150字程度、簡潔な手順、日本語。"}`;

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(geminiKey)}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error('Gemini API error ' + res.status + ': ' + errText.slice(0,200));
    }
    const json = await res.json();
    const text = (json.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('\n');
    const clean = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    return { name: parsed.name, meaning: parsed.meaning, recipe: parsed.recipe };
  }

      smallSettings.className = 'rpg-settings-link'; smallSettings.style.display='block'; smallSettings.style.marginTop='6px';
      smallSettings.textContent = 'APIキーを変更';
      smallSettings.addEventListener('click', () => { geminiKey = null; saveGeminiKey(); render(); });
      gWrap.appendChild(smallSettings);
      if (currentGacha) renderGachaResult(gWrap, currentGacha);
      if (gachaError) {
        const errBox = document.createElement('div'); errBox.style.cssText='font-size:12px;color:#ff6b6b;margin-top:8px;line-height:1.6;';
        errBox.textContent = gachaError;
        gWrap.appendChild(errBox);
      }
    }
    root.appendChild(gWrap);

    // dungeon (single, fixed)
    const dWrap = document.createElement('div'); dWrap.className='pw';
    const dTitle = document.createElement('div'); dTitle.className='pw-title'; dTitle.textContent='ダンジョン：年収1億円'; dWrap.appendChild(dTitle);
    const dc = document.createElement('div'); dc.className='rpg-dungeon';
    const pct = Math.min(100, Math.round((dungeon.currentFloor/dungeon.totalFloors)*100));
    dc.innerHTML = `
      <div class="rpg-dungeon-floor-bar"><div class="rpg-dungeon-floor-fill" style="width:${pct}%"></div></div>
      <div class="rpg-dungeon-meta">${dungeon.currentFloor} / ${dungeon.totalFloors} フロア (${pct}%) ・ 任期満了日にゴール到達</div>
      <div class="rpg-dungeon-note">クエストを1件以上達成した日ごとに、1フロア進みます(1日1フロアまで)。毎日コツコツ進めれば、ちょうど任期満了までにゴールする設計です。</div>
    `;
    dWrap.appendChild(dc);
    root.appendChild(dWrap);

    // SOS
    const sos = document.createElement('button'); sos.className='rpg-sos-btn'; sos.textContent='回復の呪文';
    sos.addEventListener('click', () => { playOpen(); openHelpModal(); });
    root.appendChild(sos);
  }

  function renderGachaResult(wrap, g){
    const old = wrap.querySelector('.rpg-item'); if (old) old.remove();
    const card = document.createElement('div'); card.className = 'rpg-item';
    card.innerHTML = `
      <div class="rpg-item-name">${g.name}</div>
      <div class="rpg-item-meaning">${g.meaning}</div>
      <div class="rpg-item-recipe">${g.recipe}</div>
    `;
    const eatBtn = document.createElement('button'); eatBtn.className='rpg-btn wide'; eatBtn.textContent='つかった！';
    eatBtn.addEventListener('click', () => {
      playComplete(); spawnConfetti();
      currentGacha = null; render();
    });
    card.appendChild(eatBtn);
    wrap.appendChild(card);
  }

  async function brewGacha(wrap, btn, mainIngredient){
    if (!mainIngredient) { gachaError = '今日の主役食材を入力してください。'; render(); return; }
    gachaError = null;
    playPotBubble();
    const potWrap = document.getElementById('rpgPotWrap');
    potWrap.classList.add('rpg-pot-brewing');
    document.getElementById('rpgPotStatus').textContent = 'ガーディアンがリサーチ中…';
    btn.disabled = true;
    const bubbleInterval = setInterval(() => { playPotBubble(); }, 220);
    try {
      const result = await generateGeminiRecipe(mainIngredient);
      clearInterval(bubbleInterval);
      potWrap.classList.remove('rpg-pot-brewing');
      currentGacha = result;
      playFanfare();
    } catch (e) {
      clearInterval(bubbleInterval);
      potWrap.classList.remove('rpg-pot-brewing');
      console.error('gemini brew error', e);
      gachaError = 'リサーチに失敗しました。この環境(アプリ内プレビュー)ではAPI通信がブロックされている可能性があります。GitHub Pagesに公開後にお試しください。エラー: ' + (e.message || e);
      currentGacha = null;
    }
    btn.disabled = false;
    render();
  }

  async function completeQuest(id, el){
    playComplete(); playSlash(); spawnConfetti();
    const hero = document.getElementById('rpgHero');
    if (hero) hero.classList.add('slash');
    el.classList.add('vanish');
    setTimeout(async () => {
      const q = quests.find(x => x.id === id);
      if (q) { q.done = true; q.completedAt = new Date().toISOString(); }
      if (dungeon.lastAdvanceDate !== todayKey) {
        dungeon.currentFloor = Math.min(dungeon.totalFloors, dungeon.currentFloor + 1);
        dungeon.lastAdvanceDate = todayKey;
        await saveDungeon();
      }
      await saveQuests();
      const newLevel = quests.filter(x=>x.done).length;
      if (newLevel % 5 === 0) playLevelUp();
      render();
    }, 480);
  }

  function fetchWeatherAuto(){
    const statusEl = document.getElementById('rpgAutoStatus');
    if (statusEl) statusEl.textContent = '位置情報を取得中…';
    if (!navigator.geolocation) { if (statusEl) statusEl.textContent = 'この環境では自動取得に対応していません。'; return; }
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      if (statusEl) statusEl.textContent = '天気情報を取得中…';
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,surface_pressure&timezone=auto`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('fetch failed: ' + res.status);
        const json = await res.json();
        const cur = json.current;
        const temp = Math.round(cur.temperature_2m), humidity = Math.round(cur.relative_humidity_2m), pressure = Math.round(cur.surface_pressure);
        const code = cur.weather_code, precip = cur.precipitation;
        let category;
        if (precip > 0 || (code >= 51 && code <= 99)) category = 'rain_low';
        else if (pressure < 1005) category = 'rain_low';
        else if (humidity >= 75) category = 'humid';
        else if (code === 0 || code === 1) category = 'sunny';
        else category = 'cloudy';
        dayData.weather = category;
        dayData.weatherAuto = {temp, humidity, pressure, fetchedAt: Date.now()};
        saveDay(); render();
      } catch (e) {
        if (statusEl) statusEl.textContent = 'この環境では自動取得がブロックされました。下のボタンで手動選択してください。';
        console.error('weather fetch error', e);
      }
    }, () => { if (statusEl) statusEl.textContent = '位置情報が許可されませんでした。'; }, {timeout: 8000});
  }

  // ================= MODALS =================
  function openHelpModal(){
    const backdrop = document.getElementById('rpgModalBackdrop'); const content = document.getElementById('rpgModalContent');
    backdrop.classList.add('open');
    content.innerHTML = `<div class="rpg-modal-title">今の状態に近いものは?</div><div class="rpg-modal-sub">選べば、遺伝子に基づいた次の一手をすぐ出します。</div><div id="rpgStateButtons"></div>`;
    const btnWrap = document.getElementById('rpgStateButtons');
    Object.keys(STATE_ADVICE).forEach(key => {
      const b = document.createElement('button'); b.className='rpg-state-btn'; b.textContent = STATE_ADVICE[key].label;
      b.addEventListener('click', () => { playSelect(); showAdvice(key); });
      btnWrap.appendChild(b);
    });
    const closeBtn = document.createElement('button'); closeBtn.className='rpg-btn secondary wide'; closeBtn.textContent='とじる';
    closeBtn.addEventListener('click', closeModal);
    content.appendChild(closeBtn);
  }
  function showAdvice(stateKey){
    const content = document.getElementById('rpgModalContent');
    const ci = cycleInfo();
    const advice = STATE_ADVICE[stateKey];
    const lines = advice.lines(ci ? ci.phase : null);
    content.innerHTML = `<div class="rpg-modal-title">${advice.label}</div><div class="rpg-advice-box" id="rpgAdviceLines"></div>`;
    const linesWrap = document.getElementById('rpgAdviceLines');
    lines.forEach(l => { const d = document.createElement('div'); d.className='rpg-advice-line'; d.innerHTML=l; linesWrap.appendChild(d); });
    const closeBtn = document.createElement('button'); closeBtn.className='rpg-btn secondary wide'; closeBtn.textContent='とじる';
    closeBtn.addEventListener('click', closeModal);
    content.appendChild(closeBtn);
  }
  function openChestModal(){
    const backdrop = document.getElementById('rpgModalBackdrop'); const content = document.getElementById('rpgModalContent');
    backdrop.classList.add('open');
    const done = quests.filter(q=>q.done).sort((a,b)=> new Date(b.completedAt)-new Date(a.completedAt));
    content.innerHTML = `<div class="rpg-modal-title">たっせいログ</div><div class="rpg-modal-sub">これまでコンプリートしたクエスト一覧</div>`;
    if (done.length === 0) {
      content.innerHTML += `<div class="rpg-quest-empty">まだ記録がありません。</div>`;
    } else {
      done.forEach(q => {
        const row = document.createElement('div'); row.className='rpg-log-row';
        row.innerHTML = `<span class="rpg-log-date">${fmtDateLog(q.completedAt)}</span>${q.text}`;
        content.appendChild(row);
      });
    }
    const closeBtn = document.createElement('button'); closeBtn.className='rpg-btn secondary wide'; closeBtn.textContent='とじる';
    closeBtn.addEventListener('click', closeModal);
    content.appendChild(closeBtn);
  }
  function closeModal(){ document.getElementById('rpgModalBackdrop').classList.remove('open'); }
  document.getElementById('rpgModalBackdrop').addEventListener('click', (e) => { if (e.target.id === 'rpgModalBackdrop') closeModal(); });

  // ================= TITLE =================
  document.getElementById('rpgSoundToggle').addEventListener('click', () => {
    soundOn = !soundOn;
    document.getElementById('rpgSoundToggle').textContent = soundOn ? '🔊' : '🔇';
    saveSound();
    if (soundOn) startBGM(); else stopBGM();
  });
  document.getElementById('rpgStartBtn').addEventListener('click', () => {
    ensureAudio(); playOpen(); setTimeout(playFanfare, 150);
    document.getElementById('rpgTitleScreen').style.display = 'none';
    document.getElementById('rpgRoot').style.display = 'block';
    startBGM();
    loadAll();
  });

})();
</script>
</body>
</html>
